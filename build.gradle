// ---------------------------------------------------------------------------
//  mcAI - Forge 1.20.1
//
//  This is the FORGE port of mcAI. The Fabric version lives on the `main`
//  branch; this branch is deliberately standalone rather than a multiloader
//  setup, so that a mistake here can never break the published Fabric jar.
//
//  Two things differ from the Fabric build and are worth knowing:
//
//  1. MAPPINGS. Fabric uses Yarn (Text, Identifier, DrawContext, MinecraftClient);
//     Forge uses Mojang official mappings (Component, ResourceLocation,
//     GuiGraphics, Minecraft). Every Minecraft API call in this tree is spelled
//     the Mojang way. Do not "revert" a name back to the Yarn spelling.
//
//  2. JAVA LEVEL. Minecraft 1.20.1 runs on Java 17, not 21.
// ---------------------------------------------------------------------------

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // Official (Mojang) mappings - see the header note.
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                mcai {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                mcai {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // No extra mavens needed: the Forge port has no Mod Menu equivalent, and its
    // config screen is reached from Forge's own mod list.
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : project.mod_id,
                "Specification-Vendor"  : "mfhry",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.mod_name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "mfhry",
        ])
    }
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
