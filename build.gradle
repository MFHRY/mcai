// ---------------------------------------------------------------------------
//  mcAI - Forge 26.1 (Minecraft 26.1.2)
//
//  This is the third build of mcAI: `main` is Fabric 1.21.1, `forge-1.20.1` is
//  the first Forge port, and this branch targets the 2026 versioning line.
//
//  What actually changed in the toolchain (all of it verified against Forge's
//  own 26.1.2 MDK, not guessed):
//
//  1. ForgeGradle 7 (7.0.17+). The `mappings channel:` block is GONE. Mappings
//     now come with the Forge artifact itself through the mavenizer
//     (`minecraft.mavenizer(it)` + `minecraft.dependency(...)`).
//  2. Gradle 9.5 and a Java 25 toolchain - Mojang ships Java 25 to players in
//     26.1+, so the class files must be 25 or players get
//     UnsupportedClassVersionError.
//  3. `net.minecraftforge:forge:<mc>-<forge>` is addressed through
//     minecraft.dependency(), and the Forge repositories have to be declared
//     with minecraft.mavenizer()/fg.forgeMaven.
//
//  EVENTBUS 7: Forge 26.x runs EventBus 7, where every event has its own bus
//  (`SomeEvent.BUS.addListener(...)`) instead of one global EVENT_BUS. The
//  `eventbus-validator` annotation processor below is what catches a listener
//  registered on a bus it can never receive.
// ---------------------------------------------------------------------------

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

// Minecraft 26.1 ships Java 25 to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The toolchain alone does not stop a 25-only API from sneaking in; pin the
    // bytecode level explicitly so the jar loads on a stock 26.1 client.
    options.release = 25
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'mcai'
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_loader_version}")
    // EventBus 7 validation at compile time (see header).
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

// Include generated resources (data generation output), same as the MDK.
sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : project.mod_id,
                "Specification-Vendor"  : "mfhry",
                "Specification-Version" : "1",
                "Implementation-Title"  : project.mod_name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : "mfhry",
        ])
    }
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Sources jar, so the release carries the code the compiled jar was built from.
java {
    withSourcesJar()
}
