pluginManagement {
	repositories {
		// ForgeGradle (net.minecraftforge.gradle) is published here, not on the
		// Gradle Plugin Portal.
		maven {
			name = 'MinecraftForge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lets Gradle DOWNLOAD a JDK when a task asks for one that is not installed.
	//
	// This is not a nicety here, it is required: the mavenizer inside
	// ForgeGradle 7 forks helper JVMs for specific Java versions (it wants a
	// JDK 8 for `modifyAccess` and a JDK 25 for the 26.1 toolchain), and
	// without a toolchain resolver those fail with
	// "No locally installed toolchains match and toolchain download
	// repositories have not been configured".
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Should match your modid
rootProject.name = 'mcai'
