# 赞助 / 捐赠渠道配置
#
# 这个文件控制 GitHub 仓库右上角的 "Sponsor" 按钮。
# 只要下面任意一个渠道被填上，按钮就会自动出现；全部留空则不会显示。
#
# 用法：删掉对应行开头的一个 "#"，把值填成你自己的账号/链接。
# 填完提交推送即可，不需要改任何代码。
#
# ---------------------------------------------------------------------------
# 现实提醒（中国大陆开发者）：
#
#   GitHub Sponsors 只在 GitHub 官方列出的支持地区开放，中国大陆不在其中，
#   因此 github: 这一项通常无法使用，保留仅供参考。
#
#   真正能用的只有下面两个：
#     · 爱发电（afdian.com）—— 注册最快，支持微信/支付宝收款
#     · 微信 / 支付宝赞赏码 —— 一张图片即可，填到 custom: 里
# ---------------------------------------------------------------------------

# GitHub Sponsors（需要先在 github.com/sponsors 开通；大陆地区通常不可用）
# 值是用户名，不带 @
# github: [mfhry]

# 爱发电（推荐）：登录 afdian.com 后，个人主页地址形如 https://afdian.com/u/xxxxxxxx
# 把 xxxxxxxx 那段填进来即可
# 如果爱发电在你的账号下无法直接映射，改用下面的 custom: 填完整链接
# open_collective: # 不适用

# Ko-fi：登录 ko-fi.com 后，值是你的主页名，形如 ko-fi.com/xxxx -> 填 xxxx
# ko_fi: # 你的 ko-fi 用户名

# Buy Me a Coffee：需要 Stripe 账户，大陆收款较困难
# buy_me_a_coffee: # 你的用户名

# 自定义链接（最多 4 条）。爱发电主页、赞赏码图片说明页等都可以放这里。
# custom: ["https://afdian.com/u/你的ID", "https://你的赞赏码说明页"]
custom: []
