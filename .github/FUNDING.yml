# 赞助 / 捐赠渠道配置
#
# 这个文件控制 GitHub 仓库右上角的 "Sponsor" 按钮。
# 只要下面任意一个渠道被填上，按钮就会自动出现；全部留空则不显示。
#
# 用法：把值填成你自己的账号/链接，提交推送即可，不需要改代码。
#
# ---------------------------------------------------------------------------
# 当前状态：
#   ✅ 爱发电        —— 已启用（见文件末尾 custom:）
#   ✅ 微信 / 支付宝 —— 已在 README 里展示赞赏码图片（docs/donate/）
#   ❌ GitHub Sponsors —— 只在 GitHub 官方列出的支持地区开放，中国大陆不在
#                         其中，因此无法开通，保留仅供参考
#   ❌ Ko-fi / Buy Me a Coffee —— 需要 PayPal / Stripe 账户，暂无
# ---------------------------------------------------------------------------

# GitHub Sponsors（需要先在 github.com/sponsors 开通；大陆地区通常不可用）
# 值是用户名，不带 @
# github: [mfhry]

# 爱发电：官方也支持这个键，但需要 "创作者 ID" 而非主页用户名，
# 因此这里统一走下面的 custom: 用完整链接，更稳妥
# open_collective: # 不适用

# Ko-fi：登录 ko-fi.com 后，值是你的主页名，形如 ko-fi.com/xxxx -> 填 xxxx
# ko_fi: # 你的 ko-fi 用户名

# Buy Me a Coffee：需要 Stripe 账户，大陆收款较困难
# buy_me_a_coffee: # 你的用户名

# 自定义链接（最多 4 条）
custom:
  - "https://afdian.com/a/1145141919810aaac"
