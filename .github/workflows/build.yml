# Build the mod and verify the jar is actually complete.
#
# Two things this workflow is specifically here to prevent:
#
#   1. Publishing a jar that compiles but is missing files. mcAI Forge 1.0.0
#      shipped without pack.mcmeta, so Forge dropped the whole resource pack:
#      item textures rendered as the missing-texture checkerboard and the chat
#      showed raw keys like mcai.cmd.status. `./gradlew build` was green the
#      whole time. tools/check_jar.py closes that gap.
#
#   2. Committing code that passes javac but breaks an invariant - unbalanced
#      braces (which javac reports as a cascade of misleading errors) or
#      language files that drift out of sync across the 8 locales.
#
# The two editions need different JDKs, so the version is keyed off the branch:
# the Fabric branch targets Minecraft 1.21.11 with Fabric Loom 1.19.3, which
# refuses to resolve on anything below JVM 25; the Forge 1.20.1 branch needs 17
# (ForgeGradle compiles its binpatched artifact with a Java 17 toolchain).
# The mod itself still targets Java 21 bytecode (build.gradle options.release).

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # forge-1.20.1 -> 17, everything else (the Fabric branches) -> 25.
          # 25 is not optional: Fabric Loom 1.19.3 (needed for Minecraft 1.21.11)
          # declares a minimum JVM runtime of 25 and fails to resolve on 21.
          java-version: ${{ github.ref_name == 'forge-1.20.1' && '17' || '25' }}
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # These run before the build: they are seconds, and a failure here is
      # much easier to read than the same problem surfacing inside javac output.

      - name: check brace balance
        run: python3 tools/check_braces.py

      - name: check translations are in sync
        run: python3 tools/check_lang.py

      - name: check every referenced lang key exists
        run: python3 tools/check_lang_usage.py

      # 1.21.11 treats a text colour's alpha as meaningful: 0xFFFFFF is invisible
      # white, not white. Nothing logs when text is invisible, so check it here.
      - name: check text colours carry an alpha channel
        run: python3 tools/check_text_colors.py

      - name: build
        run: ./gradlew build --no-daemon

      # The important one: compiled successfully is not the same as complete.
      - name: verify jar contents
        run: python3 tools/check_jar.py

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mcAI-artifacts
          path: build/libs/
