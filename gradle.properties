# ---------------------------------------------------------------------------
#  mcAI - build configuration
#
#  IMPORTANT: do NOT add `org.gradle.java.home` to this file.
#  It needs an absolute path to a local JDK, which would (a) leak your machine
#  layout into a public repository and (b) break the build for everyone else.
#
#  If your default `java` is not JDK 21, pin it per machine instead:
#      Windows :  %USERPROFILE%\.gradle\gradle.properties
#      Linux   :  ~/.gradle/gradle.properties
#      macOS   :  ~/.gradle/gradle.properties
#  ...or export JAVA_HOME before running gradlew.
#
#  Minecraft 1.21.1 / Fabric Loom 1.7.x require JDK 21.
# ---------------------------------------------------------------------------

# --- Fabric Properties ---
# https://fabricmc.net/develop/
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
fabric_version=0.116.17+1.21.1

# --- Mod Properties ---
# build.gradle reads project.mod_version / project.maven_group /
# project.archives_base_name. Those three key names must match exactly.
# (The Fabric template calls them mod_version / maven_group - renaming them to
#  version / group will fail with "Could not get unknown property 'mod_version'".)
mod_version=1.20
maven_group=com.example.mcai
archives_base_name=mcai

# Informational only - the authoritative mod id and display name live in
# src/main/resources/fabric.mod.json
mod_id=mcai
mod_name=mcAI
