# ---------------------------------------------------------------------------
#  mcAI - build configuration (Fabric 26.1 / Minecraft 26.1.2)
#
#  IMPORTANT: do NOT add `org.gradle.java.home` to this file.
#  It needs an absolute path to a local JDK, which would (a) leak your machine
#  layout into a public repository and (b) break the build for everyone else.
#
#  Minecraft 26.1 ships Java 25 to end users, so the jar must be class-file 25.
# ---------------------------------------------------------------------------

# --- Fabric Properties ---
# https://fabricmc.net/develop/  (branch 26.1.2)
minecraft_version=26.1.2
loader_version=0.20.1
fabric_version=0.155.3+26.1.2
# Optional dependency, only for the "open settings from Mod Menu" button.
modmenu_version=18.0.2

# --- Mod Properties ---
# build.gradle reads project.mod_version / project.maven_group /
# project.archives_base_name. Those three key names must match exactly.
mod_version=1.0.1
maven_group=com.example.mcai
# Include the MC line in the artifact name so the Fabric 26.1 jar can never be
# confused with the 1.21.11 one in a download folder.
archives_base_name=mcai-fabric-26.1

# Informational only - the authoritative mod id and display name live in
# src/main/resources/fabric.mod.json
mod_id=mcai
mod_name=mcAI
