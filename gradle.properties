# ---------------------------------------------------------------------------
#  mcAI - build configuration (Forge 26.1 / Minecraft 26.1.2)
#
#  This branch targets the 2026 versioning line. The Forge artifact is
#  addressed as <minecraft_version>-<forge_loader_version>, i.e.
#  "net.minecraftforge:forge:26.1.2-64.1.5" - two DIFFERENT numbers that both
#  live in this file. The 1.20.1 branch kept the full coordinate in one
#  property; with the mavenizer the two halves are used separately, so they are
#  split here.
#
#  IMPORTANT: do NOT add `org.gradle.java.home` to this file.
#  It needs an absolute path to a local JDK, which would (a) leak your machine
#  layout into a public repository and (b) break the build for everyone else.
#
#  If your default `java` is not JDK 25, pin it per machine instead:
#      Windows :  %USERPROFILE%\.gradle\gradle.properties
#      Linux   :  ~/.gradle/gradle.properties
#      macOS   :  ~/.gradle/gradle.properties
#  ...or export JAVA_HOME before running gradlew.
#
#  Minecraft 26.1 requires JDK 25 (Mojang upgraded the bundled runtime).
# ---------------------------------------------------------------------------

# --- Forge Properties ---
minecraft_version=26.1.2
forge_loader_version=64.1.5

# --- Mod Properties ---
# build.gradle reads project.mod_version / project.maven_group /
# project.archives_base_name. Those key names must match exactly.
#
# This line keeps its own version: it is a different MC edition from the 1.20.1
# Forge port (1.0.x) and the Fabric jar (1.25.x), and inheriting either number
# would imply this jar is the same thing with the same history, which it is not.
mod_version=1.0.0
maven_group=com.example.mcai
archives_base_name=mcai-forge-26.1

# Informational only - the authoritative mod id and display name live in
# src/main/resources/META-INF/mods.toml
mod_id=mcai
mod_name=mcAI

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Forge 26.1 dev runs REQUIRE this (ForgeGradle 7 opt-in, off by default).
#
# What it does: merges each source set's classes and resources into ONE
# directory (build/sourceSets/main) instead of the two classic ones
# (build/classes/java/main + build/resources/main).
#
# Why it matters here: the Slime launcher hands FML exactly one path per mod and
# scans it for @Mod classes. Without the merge that path is build/resources/main
# - resources only, no classes - so FML finds the mods.toml, finds zero @Mod
# classes, and the game dies at startup with
#
#     File .../build/resources/main constructed 0 mods: [], but had 1 mods
#     specified: [mcai]
#
# The warning ForgeGradle prints about this is easy to miss in a normal build,
# which is why it is spelled out here.
net.minecraftforge.gradle.merge-source-sets=true

# English + UTF-8 compiler output. javac otherwise emits diagnostics in the OS
# locale (GBK here), which mangles them in Gradle's plain-console log and makes
# build failures much harder to read.
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
